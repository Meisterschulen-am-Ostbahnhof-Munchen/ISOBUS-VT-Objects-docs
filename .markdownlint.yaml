# .markdownlint.yml - Konfigurationsdatei für MarkdownLint

# Basis: markdownlint's "relaxed" Preset, außer first-line-h1 (bleibt aktiv,
# da sinnvoll und mit überschaubarer Trefferzahl). Alle Regeln an, außer den
# unten genannten Layout-Regeln, die bei einer großen, historisch gewachsenen
# Doku zu viel Rauschen ohne inhaltlichen Nutzen erzeugen.
default: true
whitespace: false
line_length: false
ul-indent: false
no-inline-html: false
no-bare-urls: false
fenced-code-language: false

# MD043/required-headings prüft eine exakte, wortwörtliche Heading-Text-
# Struktur pro Datei (z.B. für ein Blog-Template) - nicht die Verschachtelung
# von Heading-Ebenen. Für diese heterogene Doku ist das nicht anwendbar.
# Falsche Verschachtelung (z.B. # gefolgt von ### ohne ##) erkennt stattdessen
# MD001/heading-increment, das über "default: true" aktiv bleibt.
MD043: false

# MD060/table-column-style ist eine reine Layout-/Whitespace-Konvention
# (Pipe-Ausrichtung in Tabellen) ohne Effekt auf das Rendering - gleiche
# Kategorie wie die whitespace/layout-Regeln oben. Feuert hier zusätzlich
# fälschlich auf Tabellenzellen mit Emoji (variable Zeichenbreite lässt
# sich nicht zuverlässig mit Leerzeichen ausrichten, auch nicht per
# `--fix`). Aus Konsistenzgründen mit dem Schwester-Repo
# visual-programming-languages-docs (dort aus demselben Grund deaktiviert)
# ebenfalls deaktiviert.
MD060: false
